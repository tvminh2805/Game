<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🔍 Tìm bóng - Xáo trộn bóng</title>
    <style>
        /* ===== CSS giữ nguyên như bản trước, chỉ bổ sung thêm style cho fallback emoji ===== */
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            touch-action: manipulation;
        }
        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }
        html, body {
            height: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(145deg, #f7f0e6 0%, #e6dccf 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            padding: 4px;
            height: 100vh;
            max-height: 100vh;
            zoom: 1;
            transform: scale(1);
        }
        .app-container {
            max-width: 600px;
            width: 100%;
            height: 100%;
            max-height: 92vh;
            background: #fefcf7;
            border-radius: 32px 32px 20px 20px;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
            padding: 8px 10px 10px;
            border: 4px solid #fff8ed;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            zoom: 1;
            transform: scale(1);
        }
        h1 {
            text-align: center;
            font-size: clamp(1rem, 4vw, 1.4rem);
            margin: 0 0 1px 0;
            color: #5d4037;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            flex-wrap: wrap;
            font-weight: 700;
            text-shadow: 2px 2px 0 #f0ddd0;
        }
        h1 small {
            font-size: clamp(0.5rem, 1.8vw, 0.65rem);
            background: #bcaaa4;
            color: white;
            padding: 2px 10px;
            border-radius: 40px;
            font-weight: 400;
        }
        .instruction-wrap {
            text-align: center;
            margin: 0px 0 4px 0;
        }
        .instruction {
            font-size: clamp(0.55rem, 2vw, 0.75rem);
            color: #6d4c41;
            background: #efe3d8;
            padding: 2px 12px;
            border-radius: 60px;
            display: inline-block;
            border: 2px dashed #b8957a;
            font-weight: 500;
        }
        .game-grid {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            gap: 4px 6px;
            flex: 1 1 auto;
            min-height: 0;
            align-items: stretch;
        }
        .column {
            flex: 1 1 110px;
            min-width: 70px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        .column-label {
            font-size: clamp(0.5rem, 1.8vw, 0.7rem);
            font-weight: 600;
            color: #4e342e;
            background: #efebe9;
            padding: 1px 10px;
            border-radius: 30px;
            border: 2px solid #bcaaa4;
        }
        .card-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 100%;
            align-items: center;
            flex: 1 1 auto;
            justify-content: space-evenly;
        }
        .card-item {
            width: 100%;
            aspect-ratio: 1 / 1;
            max-width: 110px;
            background: #ffffff;
            border-radius: 18px 10px 18px 10px;
            box-shadow: 0 3px 0 #b8957a, 0 5px 10px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.15s;
            cursor: pointer;
            border: 3px solid #f5eee9;
            padding: 3px;
            flex-shrink: 0;
        }
        .card-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            gap: 1px;
        }
        .card-image {
            width: 78%;
            height: 72%;
            object-fit: contain;
            display: block;
        }
        .animal-name {
            font-size: clamp(0.45rem, 1.6vw, 0.65rem);
            font-weight: 700;
            color: #4e342e;
            text-align: center;
            line-height: 1.2;
        }
        .shadow-card .card-image {
            filter: grayscale(1) brightness(0.45) drop-shadow(2px 4px 6px rgba(0,0,0,0.2));
            opacity: 0.85;
        }
        .shadow-card .animal-name {
            display: none;
        }
        .card-item.selected {
            box-shadow: 0 0 0 4px #ffb74d, 0 3px 0 #b8957a;
            transform: scale(1.03);
            border-color: #ffa726;
            background: #fff3e0;
        }
        .card-item.matched {
            opacity: 0.5;
            filter: grayscale(0.5);
            box-shadow: 0 2px 0 #6d8f6d, 0 4px 8px rgba(0, 0, 0, 0.08);
            border-color: #8bc34a;
            cursor: default;
            pointer-events: none;
            transform: scale(0.94);
        }
        .card-item.matched .card-image {
            filter: grayscale(0.3) brightness(0.9);
        }
        .card-item:active:not(.matched):not(.selected) {
            transform: scale(0.92);
        }
        .shake {
            animation: shake 0.3s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }
        .connector-status {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
            margin: 2px 0 2px;
            flex-shrink: 0;
        }
        .status-badge {
            background: #d7ccc8;
            padding: 1px 8px;
            border-radius: 60px;
            font-size: clamp(0.45rem, 1.5vw, 0.6rem);
            color: #3e2723;
            font-weight: 600;
            border: 2px solid #bcaaa4;
            white-space: nowrap;
        }
        .page-indicator {
            font-size: clamp(0.45rem, 1.5vw, 0.65rem);
            font-weight: 600;
            color: #4e342e;
            background: #efebe9;
            padding: 1px 10px;
            border-radius: 30px;
            border: 2px solid #bcaaa4;
            white-space: nowrap;
        }
        .footer {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-top: 2px;
            flex-wrap: wrap;
            flex-shrink: 0;
            padding: 2px 0;
        }
        .nav-btn, .reset-btn {
            background: #a1887f;
            border: none;
            padding: 5px 12px;
            border-radius: 60px;
            font-size: clamp(0.5rem, 1.8vw, 0.75rem);
            font-weight: bold;
            color: white;
            box-shadow: 0 2px 0 #5d4037;
            cursor: pointer;
            border: 2px solid #8d6e63;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            transition: 0.05s linear;
            min-width: 44px;
            justify-content: center;
            flex-shrink: 0;
        }
        .nav-btn:active, .reset-btn:active {
            transform: translateY(2px);
            box-shadow: 0 0px 0 #5d4037;
        }
        .nav-btn:disabled {
            opacity: 0.4;
            transform: translateY(1px);
            box-shadow: 0 1px 0 #5d4037;
            pointer-events: none;
        }
        .toast {
            background: #4caf50;
            color: white;
            padding: 1px 12px;
            border-radius: 60px;
            font-weight: 600;
            font-size: clamp(0.4rem, 1.5vw, 0.65rem);
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
            display: inline-block;
            margin-top: 0px;
            border: 2px solid #388e3c;
        }
        .toast.show {
            visibility: visible;
            opacity: 1;
        }
        .fallback-emoji {
            font-size: 2.5rem;
            line-height: 1;
        }
        @media (max-width: 450px) {
            .app-container { padding: 6px 6px 8px; max-height: 96vh; border-radius: 24px; }
            .card-item { max-width: 85px; border-radius: 14px 8px 14px 8px; border-width: 2px; box-shadow: 0 2px 0 #b8957a, 0 4px 8px rgba(0,0,0,0.08); padding: 2px; }
            .card-image { width: 75%; height: 70%; }
            .card-list { gap: 4px; }
            .column { flex: 1 1 80px; min-width: 60px; gap: 2px; }
        }
        @media (max-width: 360px) {
            .app-container { padding: 4px 4px 6px; max-height: 98vh; border-radius: 18px; border-width: 2px; }
            .card-item { max-width: 65px; border-radius: 10px 6px 10px 6px; border-width: 2px; box-shadow: 0 2px 0 #b8957a, 0 3px 6px rgba(0,0,0,0.08); padding: 2px; }
            .card-image { width: 72%; height: 68%; }
            .column { flex: 1 1 60px; min-width: 50px; gap: 2px; }
            .nav-btn, .reset-btn { font-size: clamp(0.4rem, 1.5vw, 0.55rem); padding: 3px 6px; min-width: 32px; box-shadow: 0 1.5px 0 #5d4037; border-width: 1.5px; }
            .fallback-emoji { font-size: 1.8rem; }
        }
        @media (max-height: 560px) {
            .app-container { padding: 4px 6px 6px; max-height: 98vh; }
            .card-item { max-width: 60px; border-radius: 10px 6px 10px 6px; border-width: 2px; box-shadow: 0 2px 0 #b8957a, 0 3px 6px rgba(0,0,0,0.08); padding: 2px; }
            .card-image { width: 70%; height: 65%; }
            .card-list { gap: 3px; }
            .column { gap: 2px; }
            .nav-btn, .reset-btn { font-size: clamp(0.4rem, 1.5vw, 0.6rem); padding: 3px 8px; min-width: 35px; box-shadow: 0 1.5px 0 #5d4037; }
            .fallback-emoji { font-size: 1.6rem; }
        }
    </style>
</head>
<body>
<div class="app-container">
    <h1>
        🧩 TÌM BÓNG
        <small>nối ảnh & bóng</small>
    </h1>
    <div class="instruction-wrap">
        <div class="instruction">👆 chọn ảnh → chọn bóng</div>
    </div>

    <div class="game-grid">
        <div class="column">
            <div class="column-label">🖼️ Ảnh</div>
            <div class="card-list" id="imageColumn"></div>
        </div>
        <div class="column">
            <div class="column-label">🌑 Bóng</div>
            <div class="card-list" id="shadowColumn"></div>
        </div>
    </div>

    <div class="connector-status">
        <span class="status-badge" id="pairsStatus">0 / 4 cặp</span>
        <span class="status-badge" id="feedbackMessage">💡 chọn ảnh</span>
        <span class="page-indicator" id="pageIndicator">Trang 1 / 2</span>
    </div>

    <div class="footer">
        <button class="nav-btn" id="prevBtn">◀ Trước</button>
        <button class="reset-btn" id="resetGameBtn">🔄 Làm mới</button>
        <button class="nav-btn" id="nextBtn">Tiếp ▶</button>
    </div>
    <div style="text-align:center; margin-top: 0px;">
        <span class="toast" id="winToast">🎉 Hoàn thành trang!</span>
    </div>
</div>

<script>
    (function() {
        // === ÂM THANH ===
        let audioCtx = null;
        function ensureAudioContext() {
            if (!audioCtx) {
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) {}
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume().catch(() => {});
            }
            return audioCtx;
        }
        function playSound(type) {
            const ctx = ensureAudioContext();
            if (!ctx) return;
            try {
                const oscillator = ctx.createOscillator();
                const gainNode = ctx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(ctx.destination);
                if (type === 'correct') {
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(1047, ctx.currentTime);
                    oscillator.frequency.setValueAtTime(1319, ctx.currentTime + 0.1);
                    gainNode.gain.setValueAtTime(0.25, ctx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
                    oscillator.start(ctx.currentTime);
                    oscillator.stop(ctx.currentTime + 0.25);
                } else if (type === 'wrong') {
                    oscillator.type = 'sawtooth';
                    oscillator.frequency.setValueAtTime(180, ctx.currentTime);
                    gainNode.gain.setValueAtTime(0.2, ctx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    oscillator.start(ctx.currentTime);
                    oscillator.stop(ctx.currentTime + 0.3);
                }
            } catch (e) {}
        }

        // === GIỌNG NÓI ===
        function speakName(name) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(name);
                utterance.lang = 'vi-VN';
                utterance.rate = 0.9;
                utterance.pitch = 1.1;
                const voices = window.speechSynthesis.getVoices();
                const vietnameseVoice = voices.find(v => v.lang.startsWith('vi'));
                if (vietnameseVoice) utterance.voice = vietnameseVoice;
                window.speechSynthesis.speak(utterance);
            }
        }

        // === HÀM XÁO TRỘN (SHUFFLE) ===
        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function generateShuffledIndices(len) {
            return shuffleArray([...Array(len).keys()]);
        }

        // === DỮ LIỆU NHIỀU TRANG ===
        const PAGES = [
            // Trang 1
            [
                { id: 0, name: 'Bọ rùa', imageUrl: 'https://lh3.googleusercontent.com/d/1PX4UwvfeHH0Un5Ge2mxc_Y_WyTaQbGnF ', shadowUrl: 'https://lh3.googleusercontent.com/d/1PX4UwvfeHH0Un5Ge2mxc_Y_WyTaQbGnF ' },
                { id: 1, name: 'Bướm', imageUrl: 'https://lh3.googleusercontent.com/d/1x93dictnbIOyO46Bxl1Rk0a4WyF6y7wy ', shadowUrl: 'https://lh3.googleusercontent.com/d/1x93dictnbIOyO46Bxl1Rk0a4WyF6y7wy ' },
                { id: 2, name: 'Châu chấu', imageUrl: 'https://lh3.googleusercontent.com/d/1Qc1WzmregnsVKcmrYjpUtpXbLBWrrB5f ', shadowUrl: 'https://lh3.googleusercontent.com/d/1Qc1WzmregnsVKcmrYjpUtpXbLBWrrB5f ' },
                { id: 3, name: 'Chim bồ câu', imageUrl: 'https://lh3.googleusercontent.com/d/1OMn-zKBmeJUg_lIwh5sUtSHz1dZC1iMe ', shadowUrl: 'https://lh3.googleusercontent.com/d/1OMn-zKBmeJUg_lIwh5sUtSHz1dZC1iMe ' }
            ],
            // Trang 2
            [
                { id: 0, name: 'Chim công', imageUrl: 'https://lh3.googleusercontent.com/d/1_TAFq9ByocFpDg_D1KZc5rLmCq9Bm5C1 ', shadowUrl: 'https://lh3.googleusercontent.com/d/1_TAFq9ByocFpDg_D1KZc5rLmCq9Bm5C1 ' },
                { id: 1, name: 'Chim cú mèo', imageUrl: 'https://lh3.googleusercontent.com/d/10TfHjAlZMaC2TxtZXsQyX3CirIDoM--M ', shadowUrl: 'https://lh3.googleusercontent.com/d/10TfHjAlZMaC2TxtZXsQyX3CirIDoM--M ' },
                { id: 2, name: 'Chim đại bàng', imageUrl: 'https://lh3.googleusercontent.com/d/1tlKJ3pqmApEsrt2f_V5Lo_sPJxA6JqkI ', shadowUrl: 'https://lh3.googleusercontent.com/d/1tlKJ3pqmApEsrt2f_V5Lo_sPJxA6JqkI ' },
                { id: 3, name: 'Chim sẻ', imageUrl: 'https://lh3.googleusercontent.com/d/1Et2z1Erh56IO6XQCUCV-6JPuHpWHu7WM ', shadowUrl: 'https://lh3.googleusercontent.com/d/1Et2z1Erh56IO6XQCUCV-6JPuHpWHu7WM ' }
            ],
			[
                { id: 0, name: 'Chuồn chuồn', imageUrl: 'https://lh3.googleusercontent.com/d/1q-svxFdlFlA17t8doLmewN2KVCS3QC0- ', shadowUrl: 'https://lh3.googleusercontent.com/d/1q-svxFdlFlA17t8doLmewN2KVCS3QC0- ' },
                { id: 1, name: 'Con vẹt', imageUrl: 'https://lh3.googleusercontent.com/d/1OzAYonGLc3Tk0WsyWNxWEMfgw3iQsBxI ', shadowUrl: 'https://lh3.googleusercontent.com/d/1OzAYonGLc3Tk0WsyWNxWEMfgw3iQsBxI ' },
                { id: 2, name: 'Con dơi', imageUrl: 'https://lh3.googleusercontent.com/d/1oU7m9OvHWONDuzp0itvuOfQoqerI9KX_ ', shadowUrl: 'https://lh3.googleusercontent.com/d/1oU7m9OvHWONDuzp0itvuOfQoqerI9KX_ ' },
                { id: 3, name: 'Con kiến', imageUrl: 'https://lh3.googleusercontent.com/d/1LU4UgSo1EWg-ss4z6DFSTFMUFYocNbXq ', shadowUrl: 'https://lh3.googleusercontent.com/d/1LU4UgSo1EWg-ss4z6DFSTFMUFYocNbXq ' }
            ],	
			[
                { id: 0, name: 'Con muỗi', imageUrl: 'https://lh3.googleusercontent.com/d/1HesfDcHX0IKTyj8jmJgW3ri81AtDCZBh ', shadowUrl: 'https://lh3.googleusercontent.com/d/1HesfDcHX0IKTyj8jmJgW3ri81AtDCZBh ' },
                { id: 1, name: 'Con nhện', imageUrl: 'https://lh3.googleusercontent.com/d/1NNE7HQYTOb5-uolQIJi_v52hsZ-23DSE ', shadowUrl: 'https://lh3.googleusercontent.com/d/1NNE7HQYTOb5-uolQIJi_v52hsZ-23DSE ' },
                { id: 2, name: 'Con ong', imageUrl: 'https://lh3.googleusercontent.com/d/1L8EA1YnYtW9hTe-800UXdy8DcLK3oM43 ', shadowUrl: 'https://lh3.googleusercontent.com/d/1L8EA1YnYtW9hTe-800UXdy8DcLK3oM43 ' },
                { id: 3, name: 'Con ruồi', imageUrl: 'https://lh3.googleusercontent.com/d/1XAjoZcNnsciBnukxnkVgQlymFdfxaLzI ', shadowUrl: 'https://lh3.googleusercontent.com/d/1XAjoZcNnsciBnukxnkVgQlymFdfxaLzI ' }
            ],
			[
                { id: 0, name: 'Chim công', imageUrl: '...', shadowUrl: '...' },
                { id: 1, name: 'Chim cú mèo', imageUrl: '...', shadowUrl: '...' },
                { id: 2, name: 'Chim đại bàng', imageUrl: '...', shadowUrl: '...' },
                { id: 3, name: 'Chim sẻ', imageUrl: '...', shadowUrl: '...' }
            ]
        ];

        // === STATE ===
        let currentPage = 0;
        let totalPages = PAGES.length;
        let currentPairs = PAGES[currentPage];
        let matchedPairs = new Array(currentPairs.length).fill(false);
        let selectedImageId = null;
        let currentShuffledIndices = generateShuffledIndices(currentPairs.length);  // thứ tự bóng hiện tại

        // DOM
        const imageColumn = document.getElementById('imageColumn');
        const shadowColumn = document.getElementById('shadowColumn');
        const pairsStatus = document.getElementById('pairsStatus');
        const feedbackMsg = document.getElementById('feedbackMessage');
        const winToast = document.getElementById('winToast');
        const pageIndicator = document.getElementById('pageIndicator');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const resetBtn = document.getElementById('resetGameBtn');

        // === HÀM LẤY EMOJI DỰ PHÒNG ===
        function getEmoji(name) {
            const map = {
                'Chó': '🐶', 'Mèo': '🐱', 'Voi': '🐘', 'Gấu': '🐻',
                'Hổ': '🐯', 'Khỉ': '🐒', 'Thỏ': '🐰', 'Cáo': '🦊'
            };
            return map[name] || '🐾';
        }

        // === RENDER ===
        function render() {
            imageColumn.innerHTML = '';
            shadowColumn.innerHTML = '';

            // Cột ảnh (giữ nguyên thứ tự)
            currentPairs.forEach((pair, index) => {
                const imgCard = document.createElement('div');
                imgCard.className = 'card-item';
                if (matchedPairs[index]) imgCard.classList.add('matched');
                imgCard.dataset.id = index;
                imgCard.dataset.type = 'image';
                const imgContent = document.createElement('div');
                imgContent.className = 'card-content';
                imgContent.innerHTML = `
                    <img class="card-image" src="${pair.imageUrl}" alt="${pair.name}" 
                         loading="lazy" 
                         onerror="this.style.display='none'; this.parentElement.querySelector('.fallback-emoji').style.display='block';">
                    <span class="fallback-emoji" style="display:none;">${getEmoji(pair.name)}</span>
                    <span class="animal-name">${pair.name}</span>
                `;
                imgCard.appendChild(imgContent);
                imgCard.addEventListener('click', onImageClick);
                imageColumn.appendChild(imgCard);
            });

            // Cột bóng (theo thứ tự đã xáo trộn)
            currentShuffledIndices.forEach((originalIndex) => {
                const pair = currentPairs[originalIndex];
                const shCard = document.createElement('div');
                shCard.className = 'card-item shadow-card';
                if (matchedPairs[originalIndex]) shCard.classList.add('matched');
                shCard.dataset.id = originalIndex;  // lưu id của cặp
                shCard.dataset.type = 'shadow';
                const shContent = document.createElement('div');
                shContent.className = 'card-content';
                shContent.innerHTML = `
                    <img class="card-image" src="${pair.shadowUrl || pair.imageUrl}" alt="${pair.name} bóng" 
                         loading="lazy"
                         onerror="this.style.display='none'; this.parentElement.querySelector('.fallback-emoji').style.display='block';">
                    <span class="fallback-emoji" style="display:none;">${getEmoji(pair.name)}</span>
                `;
                shCard.appendChild(shContent);
                shCard.addEventListener('click', onShadowClick);
                shadowColumn.appendChild(shCard);
            });

            // Highlight ảnh đang chọn
            if (selectedImageId !== null && !matchedPairs[selectedImageId]) {
                const imageCards = imageColumn.querySelectorAll('.card-item');
                imageCards.forEach(card => {
                    if (parseInt(card.dataset.id) === selectedImageId) {
                        card.classList.add('selected');
                    }
                });
            }

            // Cập nhật trạng thái
            const matchedCount = matchedPairs.filter(v => v).length;
            pairsStatus.textContent = `${matchedCount} / ${currentPairs.length} cặp`;

            const isPageComplete = matchedCount === currentPairs.length;
            if (isPageComplete) {
                feedbackMsg.textContent = '🎉 Hoàn thành trang!';
                winToast.classList.add('show');
                nextBtn.disabled = (currentPage >= totalPages - 1);
                if (currentPage === totalPages - 1) {
                    nextBtn.textContent = '🏁 Kết thúc';
                    nextBtn.disabled = true;
                } else {
                    nextBtn.textContent = 'Tiếp ▶';
                    nextBtn.disabled = false;
                }
            } else {
                winToast.classList.remove('show');
                nextBtn.disabled = true;
                if (selectedImageId !== null && !matchedPairs[selectedImageId]) {
                    feedbackMsg.textContent = `🔍 Đang chọn: ${currentPairs[selectedImageId].name}`;
                } else {
                    feedbackMsg.textContent = '💡 Nhấn vào ảnh';
                }
            }

            pageIndicator.textContent = `Trang ${currentPage + 1} / ${totalPages}`;
            prevBtn.disabled = (currentPage === 0);
        }

        // === SỰ KIỆN ===
        function onImageClick(e) {
            const card = e.currentTarget;
            const id = parseInt(card.dataset.id);
            const pair = currentPairs[id];
            speakName(pair.name);
            if (matchedPairs[id]) {
                feedbackMsg.textContent = `⛔ ${pair.name} đã nối`;
                return;
            }
            if (selectedImageId === id) {
                selectedImageId = null;
                feedbackMsg.textContent = '💡 Đã bỏ chọn';
                render();
                return;
            }
            selectedImageId = id;
            feedbackMsg.textContent = `🔍 Đang chọn: ${pair.name}`;
            render();
        }

        function onShadowClick(e) {
            const card = e.currentTarget;
            const shadowId = parseInt(card.dataset.id); // lấy id của cặp gốc
            if (matchedPairs[shadowId]) {
                feedbackMsg.textContent = `⛔ Bóng đã nối`;
                return;
            }
            if (selectedImageId === null) {
                feedbackMsg.textContent = '👆 Chọn ảnh trước';
                return;
            }
            if (matchedPairs[selectedImageId]) {
                selectedImageId = null;
                feedbackMsg.textContent = '⚠️ Ảnh đã nối, chọn ảnh khác';
                render();
                return;
            }
            if (selectedImageId === shadowId) {
                // Nối đúng
                matchedPairs[selectedImageId] = true;
                selectedImageId = null;
                feedbackMsg.textContent = '✅ Nối đúng!';
                playSound('correct');
                render();
            } else {
                // Sai
                feedbackMsg.textContent = `❌ Sai! ${currentPairs[selectedImageId].name} không khớp`;
                playSound('wrong');
                render();
                card.classList.add('shake');
                setTimeout(() => card.classList.remove('shake'), 300);
            }
        }

        // === CHUYỂN TRANG ===
        function goToPage(page) {
            if (page < 0 || page >= totalPages) return;
            const matchedCount = matchedPairs.filter(v => v).length;
            if (page > currentPage && matchedCount < currentPairs.length) {
                feedbackMsg.textContent = '⚠️ Hãy nối hết các cặp trước khi sang trang mới!';
                return;
            }
            currentPage = page;
            currentPairs = PAGES[currentPage];
            matchedPairs = new Array(currentPairs.length).fill(false);
            selectedImageId = null;
            // Tạo xáo trộn mới cho bóng
            currentShuffledIndices = generateShuffledIndices(currentPairs.length);
            winToast.classList.remove('show');
            feedbackMsg.textContent = `📖 Trang ${currentPage + 1}`;
            render();
        }

        // === RESET TRANG ===
        function resetGame() {
            matchedPairs = new Array(currentPairs.length).fill(false);
            selectedImageId = null;
            // Xáo trộn lại bóng
            currentShuffledIndices = generateShuffledIndices(currentPairs.length);
            winToast.classList.remove('show');
            feedbackMsg.textContent = '🔄 Đã làm mới trang';
            render();
        }

        // === GÁN SỰ KIỆN ===
        prevBtn.addEventListener('click', () => goToPage(currentPage - 1));
        nextBtn.addEventListener('click', () => {
            if (currentPage < totalPages - 1) goToPage(currentPage + 1);
        });
        resetBtn.addEventListener('click', resetGame);

        // === KHỞI TẠO ===
        if ('speechSynthesis' in window) {
            window.speechSynthesis.getVoices();
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }
        render();
        feedbackMsg.textContent = '💡 Nhấn vào ảnh để bắt đầu';
        document.addEventListener('touchstart', () => ensureAudioContext(), { once: true });
        document.addEventListener('click', () => ensureAudioContext(), { once: true });
    })();
</script>
</body>
</html>
