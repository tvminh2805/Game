<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔍 Nối ảnh với bóng</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background: linear-gradient(145deg, #f7f0e6 0%, #e6dccf 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            padding: 8px;
            height: 100vh;
            max-height: 100vh;
        }

        .app-container {
            max-width: 700px;
            width: 100%;
            height: 100%;
            max-height: 700px;
            background: #fefcf7;
            border-radius: 48px 48px 32px 32px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.2);
            padding: 16px 18px 20px;
            border: 4px solid #fff8ed;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.2s;
        }

        h1 {
            text-align: center;
            font-size: 1.6rem;
            margin: 0 0 2px 0;
            color: #5d4037;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
            font-weight: 700;
            text-shadow: 2px 2px 0 #f0ddd0;
        }

        h1 small {
            font-size: 0.75rem;
            background: #bcaaa4;
            color: white;
            padding: 4px 14px;
            border-radius: 40px;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .instruction-wrap {
            text-align: center;
            margin: 2px 0 10px 0;
        }

        .instruction {
            font-size: 0.95rem;
            color: #6d4c41;
            background: #efe3d8;
            padding: 6px 16px;
            border-radius: 60px;
            display: inline-block;
            border: 2px dashed #b8957a;
            font-weight: 500;
        }

        .game-grid {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px 12px;
            flex: 1 1 auto;
            min-height: 0;
            align-items: stretch;
        }

        .column {
            flex: 1 1 120px;
            min-width: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .column-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #4e342e;
            background: #efebe9;
            padding: 2px 16px;
            border-radius: 30px;
            border: 2px solid #bcaaa4;
            letter-spacing: 0.5px;
        }

        .card-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            align-items: center;
            flex: 1 1 auto;
            justify-content: space-evenly;
        }

        .card-item {
            width: 100%;
            aspect-ratio: 1 / 1;
            max-width: 130px;
            background: #ffffff;
            border-radius: 28px 16px 28px 16px;
            box-shadow: 0 6px 0 #b8957a, 0 8px 16px rgba(0, 0, 0, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.15s;
            cursor: pointer;
            border: 4px solid #f5eee9;
            padding: 4px;
            flex-shrink: 0;
        }

        .card-item span {
            font-size: 3.2rem;
            line-height: 1;
        }

        .shadow-card span {
            filter: grayscale(1) brightness(0.4) drop-shadow(2px 4px 6px rgba(0,0,0,0.15));
            opacity: 0.85;
        }

        .card-item.selected {
            box-shadow: 0 0 0 5px #ffb74d, 0 6px 0 #b8957a;
            transform: scale(1.02);
            border-color: #ffa726;
            background: #fff3e0;
        }

        .card-item.matched {
            opacity: 0.5;
            filter: grayscale(0.5);
            box-shadow: 0 3px 0 #6d8f6d, 0 6px 12px rgba(0, 0, 0, 0.08);
            border-color: #8bc34a;
            cursor: default;
            pointer-events: none;
            transform: scale(0.94);
        }

        .card-item.matched span {
            filter: grayscale(0.3) brightness(0.9);
        }

        .card-item:active:not(.matched):not(.selected) {
            transform: scale(0.92);
        }

        /* hiệu ứng rung khi sai */
        .shake {
            animation: shake 0.3s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(5px); }
        }

        .connector-status {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin: 6px 0 4px;
        }

        .status-badge {
            background: #d7ccc8;
            padding: 4px 18px;
            border-radius: 60px;
            font-size: 0.8rem;
            color: #3e2723;
            font-weight: 600;
            border: 2px solid #bcaaa4;
        }

        .footer {
            display: flex;
            justify-content: center;
            margin-top: 4px;
        }

        .reset-btn {
            background: #a1887f;
            border: none;
            padding: 10px 28px;
            border-radius: 60px;
            font-size: 1.05rem;
            font-weight: bold;
            color: white;
            box-shadow: 0 5px 0 #5d4037;
            cursor: pointer;
            border: 2px solid #8d6e63;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: 0.05s linear;
        }

        .reset-btn:active {
            transform: translateY(5px);
            box-shadow: 0 0px 0 #5d4037;
        }

        .toast {
            background: #4caf50;
            color: white;
            padding: 4px 18px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.85rem;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
            display: inline-block;
            margin-top: 2px;
            border: 2px solid #388e3c;
        }

        .toast.show {
            visibility: visible;
            opacity: 1;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .app-container {
                padding: 12px 12px 16px;
                max-height: 98vh;
                border-radius: 32px;
            }
            h1 {
                font-size: 1.3rem;
            }
            h1 small {
                font-size: 0.65rem;
                padding: 2px 10px;
            }
            .instruction {
                font-size: 0.75rem;
                padding: 4px 12px;
            }
            .column {
                flex: 1 1 90px;
                min-width: 70px;
                gap: 6px;
            }
            .card-item {
                max-width: 100px;
                border-radius: 20px 12px 20px 12px;
                border-width: 3px;
                box-shadow: 0 4px 0 #b8957a, 0 6px 12px rgba(0,0,0,0.1);
            }
            .card-item span {
                font-size: 2.6rem;
            }
            .card-list {
                gap: 8px;
            }
            .column-label {
                font-size: 0.7rem;
                padding: 2px 10px;
            }
            .status-badge {
                font-size: 0.7rem;
                padding: 2px 12px;
            }
            .reset-btn {
                font-size: 0.9rem;
                padding: 8px 20px;
                box-shadow: 0 4px 0 #5d4037;
            }
            .toast {
                font-size: 0.7rem;
                padding: 3px 14px;
            }
        }

        @media (max-width: 420px) {
            .app-container {
                padding: 8px 8px 12px;
                max-height: 100vh;
                border-radius: 24px;
            }
            h1 {
                font-size: 1.1rem;
            }
            .instruction {
                font-size: 0.65rem;
                padding: 3px 10px;
            }
            .column {
                flex: 1 1 70px;
                min-width: 60px;
                gap: 4px;
            }
            .card-item {
                max-width: 80px;
                border-radius: 16px 8px 16px 8px;
                border-width: 2px;
                box-shadow: 0 3px 0 #b8957a, 0 4px 8px rgba(0,0,0,0.08);
            }
            .card-item span {
                font-size: 2rem;
            }
            .card-list {
                gap: 6px;
            }
            .column-label {
                font-size: 0.6rem;
                padding: 1px 8px;
            }
            .status-badge {
                font-size: 0.6rem;
                padding: 2px 8px;
            }
            .reset-btn {
                font-size: 0.75rem;
                padding: 6px 14px;
                box-shadow: 0 3px 0 #5d4037;
            }
            .toast {
                font-size: 0.6rem;
                padding: 2px 10px;
            }
            .connector-status {
                gap: 6px;
            }
        }

        @media (max-height: 650px) {
            .app-container {
                padding: 8px 10px 10px;
            }
            h1 {
                font-size: 1rem;
                margin-bottom: 0;
            }
            .instruction {
                font-size: 0.6rem;
                padding: 2px 8px;
            }
            .card-item {
                max-width: 70px;
            }
            .card-item span {
                font-size: 1.8rem;
            }
            .card-list {
                gap: 4px;
            }
            .column {
                gap: 4px;
            }
            .reset-btn {
                font-size: 0.7rem;
                padding: 5px 12px;
            }
            .status-badge {
                font-size: 0.6rem;
                padding: 1px 8px;
            }
        }
    </style>
</head>
<body>
<div class="app-container">
    <h1>
        🧩 TÌM BÓNG
        <small>nối ảnh & bóng</small>
    </h1>
    <div class="instruction-wrap">
        <div class="instruction">👆 chọn ảnh → chọn bóng</div>
    </div>

    <div class="game-grid">
        <div class="column">
            <div class="column-label">🖼️ Ảnh</div>
            <div class="card-list" id="imageColumn"></div>
        </div>
        <div class="column">
            <div class="column-label">🌑 Bóng</div>
            <div class="card-list" id="shadowColumn"></div>
        </div>
    </div>

    <div class="connector-status">
        <span class="status-badge" id="pairsStatus">0 / 4 cặp</span>
        <span class="status-badge" id="feedbackMessage">💡 chọn ảnh</span>
    </div>
    <div class="footer">
        <button class="reset-btn" id="resetGameBtn">🔄 Chơi lại</button>
    </div>
    <div style="text-align:center; margin-top: 2px;">
        <span class="toast" id="winToast">🎉 Hoàn thành!</span>
    </div>
</div>

<script>
    (function() {
        // === ÂM THANH với sự khác biệt rõ ràng ===
        let audioCtx = null;

        function ensureAudioContext() {
            if (!audioCtx) {
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) {
                    // fallback: không làm gì
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume().catch(() => {});
            }
            return audioCtx;
        }

        function playSound(type) {
            const ctx = ensureAudioContext();
            if (!ctx) return;

            try {
                const oscillator = ctx.createOscillator();
                const gainNode = ctx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(ctx.destination);

                if (type === 'correct') {
                    // Âm thanh vui – hai nốt cao
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(1047, ctx.currentTime);  // C6
                    oscillator.frequency.setValueAtTime(1319, ctx.currentTime + 0.1); // E6
                    gainNode.gain.setValueAtTime(0.25, ctx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
                    oscillator.start(ctx.currentTime);
                    oscillator.stop(ctx.currentTime + 0.25);
                } else if (type === 'wrong') {
                    // Âm thanh trầm “buz”
                    oscillator.type = 'sawtooth';
                    oscillator.frequency.setValueAtTime(180, ctx.currentTime);
                    gainNode.gain.setValueAtTime(0.2, ctx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    oscillator.start(ctx.currentTime);
                    oscillator.stop(ctx.currentTime + 0.3);
                }
            } catch (e) {
                // bỏ qua nếu không phát được
            }
        }

        // === LOGIC GAME ===
        const PAIRS = [
            { id: 0, name: 'Chó', image: '🐶', shadow: '🐕' },
            { id: 1, name: 'Mèo', image: '🐱', shadow: '🐈' },
            { id: 2, name: 'Voi', image: '🐘', shadow: '🐘' },
            { id: 3, name: 'Gấu', image: '🐻', shadow: '🐻' }
        ];

        let selectedImageId = null;
        let matchedPairs = new Array(PAIRS.length).fill(false);
        let pairCount = PAIRS.length;

        const imageColumn = document.getElementById('imageColumn');
        const shadowColumn = document.getElementById('shadowColumn');
        const pairsStatus = document.getElementById('pairsStatus');
        const feedbackMsg = document.getElementById('feedbackMessage');
        const winToast = document.getElementById('winToast');

        function render() {
            imageColumn.innerHTML = '';
            shadowColumn.innerHTML = '';

            PAIRS.forEach((pair, index) => {
                // Ảnh
                const imgCard = document.createElement('div');
                imgCard.className = 'card-item';
                if (matchedPairs[index]) imgCard.classList.add('matched');
                imgCard.dataset.id = index;
                imgCard.dataset.type = 'image';
                const imgSpan = document.createElement('span');
                imgSpan.textContent = pair.image;
                imgCard.appendChild(imgSpan);
                imgCard.addEventListener('click', onImageClick);
                imageColumn.appendChild(imgCard);

                // Bóng
                const shCard = document.createElement('div');
                shCard.className = 'card-item shadow-card';
                if (matchedPairs[index]) shCard.classList.add('matched');
                shCard.dataset.id = index;
                shCard.dataset.type = 'shadow';
                const shSpan = document.createElement('span');
                shSpan.textContent = pair.shadow;
                shCard.appendChild(shSpan);
                shCard.addEventListener('click', onShadowClick);
                shadowColumn.appendChild(shCard);
            });

            // highlight
            if (selectedImageId !== null && !matchedPairs[selectedImageId]) {
                const imageCards = imageColumn.querySelectorAll('.card-item');
                imageCards.forEach(card => {
                    if (parseInt(card.dataset.id) === selectedImageId) {
                        card.classList.add('selected');
                    }
                });
            }

            const matchedCount = matchedPairs.filter(v => v).length;
            pairsStatus.textContent = `${matchedCount} / ${pairCount} cặp`;

            if (matchedCount === pairCount) {
                feedbackMsg.textContent = '🎉 Tuyệt vời!';
                winToast.classList.add('show');
            } else {
                winToast.classList.remove('show');
                if (selectedImageId !== null && !matchedPairs[selectedImageId]) {
                    feedbackMsg.textContent = `🔍 Đang chọn: ${PAIRS[selectedImageId].name}`;
                } else {
                    feedbackMsg.textContent = '💡 Nhấn vào ảnh';
                }
            }
        }

        function onImageClick(e) {
            const card = e.currentTarget;
            const id = parseInt(card.dataset.id);
            if (matchedPairs[id]) {
                feedbackMsg.textContent = `⛔ ${PAIRS[id].name} đã nối`;
                return;
            }
            if (selectedImageId === id) {
                selectedImageId = null;
                feedbackMsg.textContent = '💡 Đã bỏ chọn';
                render();
                return;
            }
            selectedImageId = id;
            feedbackMsg.textContent = `🔍 Đang chọn: ${PAIRS[id].name}`;
            render();
        }

        function onShadowClick(e) {
            const card = e.currentTarget;
            const shadowId = parseInt(card.dataset.id);
            if (matchedPairs[shadowId]) {
                feedbackMsg.textContent = `⛔ Bóng đã nối`;
                return;
            }
            if (selectedImageId === null) {
                feedbackMsg.textContent = '👆 Chọn ảnh trước';
                return;
            }
            if (matchedPairs[selectedImageId]) {
                selectedImageId = null;
                feedbackMsg.textContent = '⚠️ Ảnh đã nối, chọn ảnh khác';
                render();
                return;
            }

            if (selectedImageId === shadowId) {
                // Đúng
                matchedPairs[selectedImageId] = true;
                selectedImageId = null;
                feedbackMsg.textContent = '✅ Nối đúng!';
                playSound('correct');   // tiếng vui
                render();
                if (matchedPairs.every(v => v)) {
                    feedbackMsg.textContent = '🎉 Chúc mừng!';
                }
            } else {
                // Sai: phát âm thanh sai + hiệu ứng rung
                feedbackMsg.textContent = `❌ Sai! ${PAIRS[selectedImageId].name} không khớp`;
                playSound('wrong');     // tiếng báo sai
                render();
                // Thêm hiệu ứng rung cho thẻ bóng
                card.classList.add('shake');
                setTimeout(() => card.classList.remove('shake'), 300);
            }
        }

        function resetGame() {
            selectedImageId = null;
            matchedPairs = new Array(PAIRS.length).fill(false);
            winToast.classList.remove('show');
            feedbackMsg.textContent = '🔄 Đã làm mới';
            render();
        }

        document.getElementById('resetGameBtn').addEventListener('click', resetGame);
        render();
        feedbackMsg.textContent = '💡 Nhấn vào ảnh để bắt đầu';

        // Kích hoạt audio context khi chạm vào màn hình (cần thiết cho iOS)
        document.addEventListener('touchstart', () => {
            ensureAudioContext();
        }, { once: true });
        document.addEventListener('click', () => {
            ensureAudioContext();
        }, { once: true });
    })();
</script>
</body>
</html>
