<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔍 Tìm bóng - Nút hiển thị đầy đủ</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            touch-action: manipulation;
        }

        body {
            background: linear-gradient(145deg, #f7f0e6 0%, #e6dccf 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            padding: 4px;
            height: 100vh;
            max-height: 100vh;
        }

        .app-container {
            max-width: 600px;
            width: 100%;
            height: 100%;
            max-height: 620px;
            background: #fefcf7;
            border-radius: 32px 32px 20px 20px;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
            padding: 8px 10px 10px;
            border: 4px solid #fff8ed;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        /* === HEADER === */
        h1 {
            text-align: center;
            font-size: 1.2rem;
            margin: 0 0 1px 0;
            color: #5d4037;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            flex-wrap: wrap;
            font-weight: 700;
            text-shadow: 2px 2px 0 #f0ddd0;
        }
        h1 small {
            font-size: 0.55rem;
            background: #bcaaa4;
            color: white;
            padding: 2px 10px;
            border-radius: 40px;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        .instruction-wrap {
            text-align: center;
            margin: 0px 0 4px 0;
        }
        .instruction {
            font-size: 0.7rem;
            color: #6d4c41;
            background: #efe3d8;
            padding: 2px 12px;
            border-radius: 60px;
            display: inline-block;
            border: 2px dashed #b8957a;
            font-weight: 500;
        }

        /* === GRID === */
        .game-grid {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            gap: 4px 6px;
            flex: 1 1 auto;
            min-height: 0;
            align-items: stretch;
        }

        .column {
            flex: 1 1 100px;
            min-width: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }

        .column-label {
            font-size: 0.65rem;
            font-weight: 600;
            color: #4e342e;
            background: #efebe9;
            padding: 1px 10px;
            border-radius: 30px;
            border: 2px solid #bcaaa4;
            letter-spacing: 0.3px;
        }

        .card-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 100%;
            align-items: center;
            flex: 1 1 auto;
            justify-content: space-evenly;
        }

        /* === CARD === */
        .card-item {
            width: 100%;
            aspect-ratio: 1 / 1;
            max-width: 100px;
            background: #ffffff;
            border-radius: 18px 10px 18px 10px;
            box-shadow: 0 3px 0 #b8957a, 0 5px 10px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.15s;
            cursor: pointer;
            border: 3px solid #f5eee9;
            padding: 3px;
            flex-shrink: 0;
        }

        .card-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            gap: 1px;
        }

        .card-image {
            width: 78%;
            height: 72%;
            object-fit: contain;
            display: block;
        }

        .animal-name {
            font-size: 0.6rem;
            font-weight: 700;
            color: #4e342e;
            text-align: center;
            line-height: 1.2;
            margin-top: 0px;
        }

        /* Bóng */
        .shadow-card .card-image {
            filter: grayscale(1) brightness(0.45) drop-shadow(2px 4px 6px rgba(0,0,0,0.2));
            opacity: 0.85;
        }
        .shadow-card .animal-name {
            display: none;
        }

        /* Trạng thái */
        .card-item.selected {
            box-shadow: 0 0 0 4px #ffb74d, 0 3px 0 #b8957a;
            transform: scale(1.03);
            border-color: #ffa726;
            background: #fff3e0;
        }
        .card-item.matched {
            opacity: 0.5;
            filter: grayscale(0.5);
            box-shadow: 0 2px 0 #6d8f6d, 0 4px 8px rgba(0, 0, 0, 0.08);
            border-color: #8bc34a;
            cursor: default;
            pointer-events: none;
            transform: scale(0.94);
        }
        .card-item.matched .card-image {
            filter: grayscale(0.3) brightness(0.9);
        }
        .card-item:active:not(.matched):not(.selected) {
            transform: scale(0.92);
        }

        .shake {
            animation: shake 0.3s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        /* === STATUS BAR === */
        .connector-status {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
            margin: 2px 0 2px;
            flex-shrink: 0;
        }

        .status-badge {
            background: #d7ccc8;
            padding: 1px 8px;
            border-radius: 60px;
            font-size: 0.55rem;
            color: #3e2723;
            font-weight: 600;
            border: 2px solid #bcaaa4;
            white-space: nowrap;
        }

        .page-indicator {
            font-size: 0.6rem;
            font-weight: 600;
            color: #4e342e;
            background: #efebe9;
            padding: 1px 10px;
            border-radius: 30px;
            border: 2px solid #bcaaa4;
            white-space: nowrap;
        }

        /* === FOOTER - QUAN TRỌNG: LUÔN HIỂN THỊ === */
        .footer {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-top: 2px;
            flex-wrap: wrap;
            flex-shrink: 0;
            padding: 2px 0;
        }

        .nav-btn, .reset-btn {
            background: #a1887f;
            border: none;
            padding: 5px 12px;
            border-radius: 60px;
            font-size: 0.7rem;
            font-weight: bold;
            color: white;
            box-shadow: 0 2px 0 #5d4037;
            cursor: pointer;
            border: 2px solid #8d6e63;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            transition: 0.05s linear;
            min-width: 48px;
            justify-content: center;
            flex-shrink: 0;
        }
        .nav-btn:active, .reset-btn:active {
            transform: translateY(2px);
            box-shadow: 0 0px 0 #5d4037;
        }
        .nav-btn:disabled {
            opacity: 0.4;
            transform: translateY(1px);
            box-shadow: 0 1px 0 #5d4037;
            pointer-events: none;
        }

        .toast {
            background: #4caf50;
            color: white;
            padding: 1px 12px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.6rem;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
            display: inline-block;
            margin-top: 0px;
            border: 2px solid #388e3c;
        }
        .toast.show {
            visibility: visible;
            opacity: 1;
        }

        /* === RESPONSIVE - TỐI ƯU CHO MỌI MÀN HÌNH === */
        @media (max-width: 450px) {
            .app-container {
                padding: 6px 6px 8px;
                max-height: 98vh;
                border-radius: 24px;
            }
            h1 {
                font-size: 1rem;
            }
            h1 small {
                font-size: 0.5rem;
                padding: 1px 8px;
            }
            .instruction {
                font-size: 0.6rem;
                padding: 1px 8px;
            }
            .column {
                flex: 1 1 80px;
                min-width: 65px;
                gap: 2px;
            }
            .card-item {
                max-width: 80px;
                border-radius: 14px 8px 14px 8px;
                border-width: 2px;
                box-shadow: 0 2px 0 #b8957a, 0 4px 8px rgba(0,0,0,0.08);
                padding: 2px;
            }
            .card-image {
                width: 75%;
                height: 70%;
            }
            .animal-name {
                font-size: 0.5rem;
            }
            .card-list {
                gap: 4px;
            }
            .column-label {
                font-size: 0.55rem;
                padding: 1px 8px;
            }
            .status-badge {
                font-size: 0.5rem;
                padding: 1px 6px;
            }
            .page-indicator {
                font-size: 0.5rem;
                padding: 1px 8px;
            }
            .nav-btn, .reset-btn {
                font-size: 0.6rem;
                padding: 4px 8px;
                min-width: 40px;
                box-shadow: 0 2px 0 #5d4037;
                border-width: 1.5px;
            }
            .toast {
                font-size: 0.5rem;
                padding: 1px 8px;
            }
            .connector-status {
                gap: 3px;
                margin: 1px 0 1px;
            }
            .footer {
                gap: 3px;
                margin-top: 1px;
                padding: 1px 0;
            }
        }

        @media (max-width: 360px) {
            .app-container {
                padding: 4px 4px 6px;
                max-height: 100vh;
                border-radius: 18px;
                border-width: 2px;
            }
            h1 {
                font-size: 0.85rem;
            }
            h1 small {
                font-size: 0.45rem;
                padding: 1px 6px;
            }
            .instruction {
                font-size: 0.5rem;
                padding: 1px 6px;
            }
            .column {
                flex: 1 1 65px;
                min-width: 55px;
                gap: 2px;
            }
            .card-item {
                max-width: 65px;
                border-radius: 10px 6px 10px 6px;
                border-width: 2px;
                box-shadow: 0 2px 0 #b8957a, 0 3px 6px rgba(0,0,0,0.08);
                padding: 2px;
            }
            .card-image {
                width: 72%;
                height: 68%;
            }
            .animal-name {
                font-size: 0.45rem;
            }
            .card-list {
                gap: 3px;
            }
            .column-label {
                font-size: 0.5rem;
                padding: 1px 6px;
            }
            .status-badge {
                font-size: 0.4rem;
                padding: 1px 5px;
            }
            .page-indicator {
                font-size: 0.45rem;
                padding: 1px 6px;
            }
            .nav-btn, .reset-btn {
                font-size: 0.5rem;
                padding: 3px 6px;
                min-width: 32px;
                box-shadow: 0 1.5px 0 #5d4037;
                border-width: 1.5px;
            }
            .toast {
                font-size: 0.45rem;
                padding: 1px 6px;
            }
            .connector-status {
                gap: 2px;
                margin: 1px 0 1px;
            }
            .footer {
                gap: 2px;
                margin-top: 1px;
                padding: 1px 0;
            }
        }

        @media (max-height: 560px) {
            .app-container {
                padding: 4px 6px 6px;
                max-height: 100vh;
            }
            h1 {
                font-size: 0.8rem;
                margin-bottom: 0;
            }
            .instruction {
                font-size: 0.5rem;
                padding: 1px 6px;
                margin-bottom: 1px;
            }
            .card-item {
                max-width: 60px;
                border-radius: 10px 6px 10px 6px;
                border-width: 2px;
                box-shadow: 0 2px 0 #b8957a, 0 3px 6px rgba(0,0,0,0.08);
                padding: 2px;
            }
            .card-image {
                width: 70%;
                height: 65%;
            }
            .animal-name {
                font-size: 0.45rem;
            }
            .card-list {
                gap: 3px;
            }
            .column {
                gap: 2px;
            }
            .nav-btn, .reset-btn {
                font-size: 0.55rem;
                padding: 3px 8px;
                min-width: 35px;
                box-shadow: 0 1.5px 0 #5d4037;
            }
            .status-badge {
                font-size: 0.45rem;
                padding: 1px 5px;
            }
            .page-indicator {
                font-size: 0.45rem;
                padding: 1px 6px;
            }
            .connector-status {
                margin: 1px 0 1px;
                gap: 2px;
            }
            .footer {
                margin-top: 1px;
                gap: 2px;
                padding: 1px 0;
            }
        }
    </style>
</head>
<body>
<div class="app-container">
    <h1>
        🧩 TÌM BÓNG
        <small>nối ảnh & bóng</small>
    </h1>
    <div class="instruction-wrap">
        <div class="instruction">👆 chọn ảnh → chọn bóng</div>
    </div>

    <div class="game-grid">
        <div class="column">
            <div class="column-label">🖼️ Ảnh</div>
            <div class="card-list" id="imageColumn"></div>
        </div>
        <div class="column">
            <div class="column-label">🌑 Bóng</div>
            <div class="card-list" id="shadowColumn"></div>
        </div>
    </div>

    <div class="connector-status">
        <span class="status-badge" id="pairsStatus">0 / 4 cặp</span>
        <span class="status-badge" id="feedbackMessage">💡 chọn ảnh</span>
        <span class="page-indicator" id="pageIndicator">Trang 1 / 2</span>
    </div>

    <div class="footer">
        <button class="nav-btn" id="prevBtn">◀ Trước</button>
        <button class="reset-btn" id="resetGameBtn">🔄 Làm mới</button>
        <button class="nav-btn" id="nextBtn">Tiếp ▶</button>
    </div>
    <div style="text-align:center; margin-top: 0px;">
        <span class="toast" id="winToast">🎉 Hoàn thành trang!</span>
    </div>
</div>

<script>
    (function() {
        // === ÂM THANH ===
        let audioCtx = null;
        function ensureAudioContext() {
            if (!audioCtx) {
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) {}
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume().catch(() => {});
            }
            return audioCtx;
        }
        function playSound(type) {
            const ctx = ensureAudioContext();
            if (!ctx) return;
            try {
                const oscillator = ctx.createOscillator();
                const gainNode = ctx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(ctx.destination);
                if (type === 'correct') {
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(1047, ctx.currentTime);
                    oscillator.frequency.setValueAtTime(1319, ctx.currentTime + 0.1);
                    gainNode.gain.setValueAtTime(0.25, ctx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
                    oscillator.start(ctx.currentTime);
                    oscillator.stop(ctx.currentTime + 0.25);
                } else if (type === 'wrong') {
                    oscillator.type = 'sawtooth';
                    oscillator.frequency.setValueAtTime(180, ctx.currentTime);
                    gainNode.gain.setValueAtTime(0.2, ctx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    oscillator.start(ctx.currentTime);
                    oscillator.stop(ctx.currentTime + 0.3);
                }
            } catch (e) {}
        }

        // === GIỌNG NÓI ===
        function speakName(name) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(name);
                utterance.lang = 'vi-VN';
                utterance.rate = 0.9;
                utterance.pitch = 1.1;
                const voices = window.speechSynthesis.getVoices();
                const vietnameseVoice = voices.find(v => v.lang.startsWith('vi'));
                if (vietnameseVoice) utterance.voice = vietnameseVoice;
                window.speechSynthesis.speak(utterance);
            }
        }

        // === DỮ LIỆU ===
        const PAGES = [
            [
                { id: 0, name: 'Chó', imageUrl: 'https://drive.google.com/uc?download=view&id=17kwKG45F3OuqDTH24PqCH4ux6aTTCJFv', shadowUrl: 'https://drive.google.com/uc?download=view&id=17kwKG45F3OuqDTH24PqCH4ux6aTTCJFv' },
                { id: 1, name: 'Mèo', imageUrl: 'https://drive.google.com/uc?download=view&id=1xAFLoGndYZbhkrkZ5sXj99ZUt8XZp-jm', shadowUrl: 'https://drive.google.com/uc?download=view&id=1xAFLoGndYZbhkrkZ5sXj99ZUt8XZp-jm' },
                { id: 2, name: 'Gà', imageUrl: 'https://drive.google.com/uc?download=view&id=1212Zx_tzjdDD-EH2SU8S6o9mFLlyGz58', shadowUrl: 'https://drive.google.com/uc?download=view&id=1212Zx_tzjdDD-EH2SU8S6o9mFLlyGz58' },
                { id: 3, name: 'Vịt', imageUrl: 'https://drive.google.com/uc?download=view&id=1XRd8NMpb4a4K1XomRSQ9RIcDTr1tt5c6', shadowUrl: 'https://drive.google.com/uc?download=view&id=1XRd8NMpb4a4K1XomRSQ9RIcDTr1tt5c6' }
            ],
            [
                { id: 0, name: 'Hổ', imageUrl: 'https://media.giphy.com/media/l3V0x6h7yS5K2qM4Y/giphy.gif', shadowUrl: 'https://media.giphy.com/media/l3V0x6h7yS5K2qM4Y/giphy.gif' },
                { id: 1, name: 'Khỉ', imageUrl: 'https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif', shadowUrl: 'https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif' },
                { id: 2, name: 'Thỏ', imageUrl: 'https://media.giphy.com/media/3o6Zt5qMl7n0bJq1Xa/giphy.gif', shadowUrl: 'https://media.giphy.com/media/3o6Zt5qMl7n0bJq1Xa/giphy.gif' },
                { id: 3, name: 'Cáo', imageUrl: 'https://media.giphy.com/media/l3V0x6h7yS5K2qM4Y/giphy.gif', shadowUrl: 'https://media.giphy.com/media/l3V0x6h7yS5K2qM4Y/giphy.gif' }
            ]
        ];

        let currentPage = 0;
        let totalPages = PAGES.length;
        let currentPairs = PAGES[currentPage];
        let selectedImageId = null;
        let matchedPairs = new Array(currentPairs.length).fill(false);

        const imageColumn = document.getElementById('imageColumn');
        const shadowColumn = document.getElementById('shadowColumn');
        const pairsStatus = document.getElementById('pairsStatus');
        const feedbackMsg = document.getElementById('feedbackMessage');
        const winToast = document.getElementById('winToast');
        const pageIndicator = document.getElementById('pageIndicator');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const resetBtn = document.getElementById('resetGameBtn');

        function render() {
            imageColumn.innerHTML = '';
            shadowColumn.innerHTML = '';

            currentPairs.forEach((pair, index) => {
                const imgCard = document.createElement('div');
                imgCard.className = 'card-item';
                if (matchedPairs[index]) imgCard.classList.add('matched');
                imgCard.dataset.id = index;
                imgCard.dataset.type = 'image';
                const imgContent = document.createElement('div');
                imgContent.className = 'card-content';
                imgContent.innerHTML = `
                    <img class="card-image" src="${pair.imageUrl}" alt="${pair.name}" loading="lazy">
                    <span class="animal-name">${pair.name}</span>
                `;
                imgCard.appendChild(imgContent);
                imgCard.addEventListener('click', onImageClick);
                imageColumn.appendChild(imgCard);

                const shCard = document.createElement('div');
                shCard.className = 'card-item shadow-card';
                if (matchedPairs[index]) shCard.classList.add('matched');
                shCard.dataset.id = index;
                shCard.dataset.type = 'shadow';
                const shContent = document.createElement('div');
                shContent.className = 'card-content';
                shContent.innerHTML = `
                    <img class="card-image" src="${pair.shadowUrl || pair.imageUrl}" alt="${pair.name} bóng" loading="lazy">
                `;
                shCard.appendChild(shContent);
                shCard.addEventListener('click', onShadowClick);
                shadowColumn.appendChild(shCard);
            });

            if (selectedImageId !== null && !matchedPairs[selectedImageId]) {
                const imageCards = imageColumn.querySelectorAll('.card-item');
                imageCards.forEach(card => {
                    if (parseInt(card.dataset.id) === selectedImageId) {
                        card.classList.add('selected');
                    }
                });
            }

            const matchedCount = matchedPairs.filter(v => v).length;
            pairsStatus.textContent = `${matchedCount} / ${currentPairs.length} cặp`;

            const isPageComplete = matchedCount === currentPairs.length;
            if (isPageComplete) {
                feedbackMsg.textContent = '🎉 Hoàn thành trang!';
                winToast.classList.add('show');
                nextBtn.disabled = (currentPage >= totalPages - 1);
                if (currentPage === totalPages - 1) {
                    nextBtn.textContent = '🏁 Kết thúc';
                    nextBtn.disabled = true;
                } else {
                    nextBtn.textContent = 'Tiếp ▶';
                    nextBtn.disabled = false;
                }
            } else {
                winToast.classList.remove('show');
                nextBtn.disabled = true;
                if (selectedImageId !== null && !matchedPairs[selectedImageId]) {
                    feedbackMsg.textContent = `🔍 Đang chọn: ${currentPairs[selectedImageId].name}`;
                } else {
                    feedbackMsg.textContent = '💡 Nhấn vào ảnh';
                }
            }

            pageIndicator.textContent = `Trang ${currentPage + 1} / ${totalPages}`;
            prevBtn.disabled = (currentPage === 0);
        }

        function onImageClick(e) {
            const card = e.currentTarget;
            const id = parseInt(card.dataset.id);
            const pair = currentPairs[id];
            speakName(pair.name);
            if (matchedPairs[id]) {
                feedbackMsg.textContent = `⛔ ${pair.name} đã nối`;
                return;
            }
            if (selectedImageId === id) {
                selectedImageId = null;
                feedbackMsg.textContent = '💡 Đã bỏ chọn';
                render();
                return;
            }
            selectedImageId = id;
            feedbackMsg.textContent = `🔍 Đang chọn: ${pair.name}`;
            render();
        }

        function onShadowClick(e) {
            const card = e.currentTarget;
            const shadowId = parseInt(card.dataset.id);
            if (matchedPairs[shadowId]) {
                feedbackMsg.textContent = `⛔ Bóng đã nối`;
                return;
            }
            if (selectedImageId === null) {
                feedbackMsg.textContent = '👆 Chọn ảnh trước';
                return;
            }
            if (matchedPairs[selectedImageId]) {
                selectedImageId = null;
                feedbackMsg.textContent = '⚠️ Ảnh đã nối, chọn ảnh khác';
                render();
                return;
            }
            if (selectedImageId === shadowId) {
                matchedPairs[selectedImageId] = true;
                selectedImageId = null;
                feedbackMsg.textContent = '✅ Nối đúng!';
                playSound('correct');
                render();
            } else {
                feedbackMsg.textContent = `❌ Sai! ${currentPairs[selectedImageId].name} không khớp`;
                playSound('wrong');
                render();
                card.classList.add('shake');
                setTimeout(() => card.classList.remove('shake'), 300);
            }
        }

        function goToPage(page) {
            if (page < 0 || page >= totalPages) return;
            const matchedCount = matchedPairs.filter(v => v).length;
            if (page > currentPage && matchedCount < currentPairs.length) {
                feedbackMsg.textContent = '⚠️ Hãy nối hết các cặp trước khi sang trang mới!';
                return;
            }
            currentPage = page;
            currentPairs = PAGES[currentPage];
            matchedPairs = new Array(currentPairs.length).fill(false);
            selectedImageId = null;
            winToast.classList.remove('show');
            feedbackMsg.textContent = `📖 Trang ${currentPage + 1}`;
            render();
        }

        prevBtn.addEventListener('click', () => goToPage(currentPage - 1));
        nextBtn.addEventListener('click', () => {
            if (currentPage < totalPages - 1) goToPage(currentPage + 1);
        });
        resetBtn.addEventListener('click', () => {
            matchedPairs = new Array(currentPairs.length).fill(false);
            selectedImageId = null;
            winToast.classList.remove('show');
            feedbackMsg.textContent = '🔄 Đã làm mới trang';
            render();
        });

        if ('speechSynthesis' in window) {
            window.speechSynthesis.getVoices();
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }
        render();
        feedbackMsg.textContent = '💡 Nhấn vào ảnh để bắt đầu';
        document.addEventListener('touchstart', () => ensureAudioContext(), { once: true });
        document.addEventListener('click', () => ensureAudioContext(), { once: true });
    })();
</script>
</body>
</html>
