<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🔍 Tìm bóng của ảnh</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            touch-action: none;
        }
        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }
        html, body {
            height: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(145deg, #f7f0e6 0%, #e6dccf 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            padding: 4px;
            height: 100vh;
            max-height: 100vh;
        }
        .app-container {
            max-width: 600px;
            width: 100%;
            height: 100%;
            max-height: 92vh;
            background: #fefcf7;
            border-radius: 32px 32px 20px 20px;
            box-shadow: 0 10px 24px rgba(0,0,0,0.18);
            padding: 8px 10px 10px;
            border: 4px solid #fff8ed;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            position: relative;
        }
        h1 {
            text-align: center;
            font-size: clamp(1rem, 4vw, 1.4rem);
            margin: 0 0 1px 0;
            color: #5d4037;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            flex-wrap: wrap;
            font-weight: 700;
            text-shadow: 2px 2px 0 #f0ddd0;
        }
        h1 small {
            font-size: clamp(0.5rem, 1.8vw, 0.65rem);
            background: #bcaaa4;
            color: #fff;
            padding: 2px 10px;
            border-radius: 40px;
            font-weight: 400;
        }
        .instruction-wrap {
            text-align: center;
            margin: 0 0 4px 0;
        }
        .instruction {
            font-size: clamp(0.55rem, 2vw, 0.75rem);
            color: #6d4c41;
            background: #efe3d8;
            padding: 2px 12px;
            border-radius: 60px;
            display: inline-block;
            border: 2px dashed #b8957a;
            font-weight: 500;
        }
        .game-grid {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            gap: 4px 6px;
            flex: 1 1 auto;
            min-height: 0;
            align-items: stretch;
        }
        .column {
            flex: 1 1 110px;
            min-width: 70px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        .column-label {
            font-size: clamp(0.5rem, 1.8vw, 0.7rem);
            font-weight: 600;
            color: #4e342e;
            background: #efebe9;
            padding: 1px 10px;
            border-radius: 30px;
            border: 2px solid #bcaaa4;
        }
        .card-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 100%;
            align-items: center;
            flex: 1 1 auto;
            justify-content: space-evenly;
        }
        .card-item {
            width: 100%;
            aspect-ratio: 1 / 1;
            max-width: 110px;
            background: #fff;
            border-radius: 18px 10px 18px 10px;
            box-shadow: 0 3px 0 #b8957a, 0 5px 10px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            border: 3px solid #f5eee9;
            padding: 3px;
            flex-shrink: 0;
            position: relative;
            transition: 0.15s;
        }
        .card-item:active {
            cursor: grabbing;
        }
        .card-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            gap: 1px;
            pointer-events: none;
        }
        .card-image {
            width: 92% !important;
            height: 88% !important;
            object-fit: contain;
            display: block;
            pointer-events: none;
        }
        .animal-name {
            font-size: clamp(0.45rem, 1.6vw, 0.65rem);
            font-weight: 700;
            color: #4e342e;
            text-align: center;
            line-height: 1.2;
            pointer-events: none;
            margin-top: 1px;
        }
        .shadow-card .card-image {
            filter: brightness(0) contrast(1.2) !important;
            opacity: 1;
        }
        .shadow-card .animal-name {
            display: none;
        }
        .card-item.selected {
            box-shadow: 0 0 0 4px #ffb74d, 0 3px 0 #b8957a;
            transform: scale(1.03);
            border-color: #ffa726;
            background: #fff3e0;
        }
        .card-item.matched {
            opacity: 0.5;
            filter: grayscale(0.5);
            box-shadow: 0 2px 0 #6d8f6d, 0 4px 8px rgba(0,0,0,0.08);
            border-color: #8bc34a;
            cursor: default;
            pointer-events: none;
            transform: scale(0.94);
        }
        .card-item.matched .card-image {
            filter: grayscale(0.3) brightness(0.9);
        }
        .card-item.dragging {
            opacity: 0.4;
            transform: scale(0.95);
        }
        .shadow-card.drag-over {
            border-color: #ffb74d;
            box-shadow: 0 0 0 4px #ffb74d, 0 3px 0 #b8957a;
            background: #fff8e1;
        }
        .drag-clone {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            width: 90px;
            height: 90px;
            background: #fff;
            border-radius: 18px 10px 18px 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #ffa726;
            padding: 4px;
            transform: translate(-50%, -50%) scale(1.05);
            opacity: 0.95;
        }
        .drag-clone img {
            width: 92% !important;
            height: 88% !important;
            object-fit: contain;
            display: block;
        }
        .shake {
            animation: shake 0.3s ease-in-out;
        }
        @keyframes shake {
            0%,100%{ transform: translateX(0); }
            20%{ transform: translateX(-6px); }
            40%{ transform: translateX(6px); }
            60%{ transform: translateX(-4px); }
            80%{ transform: translateX(4px); }
        }
        .connector-status {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
            margin: 2px 0 2px;
            flex-shrink: 0;
        }
        .status-badge {
            background: #d7ccc8;
            padding: 1px 8px;
            border-radius: 60px;
            font-size: clamp(0.45rem, 1.5vw, 0.6rem);
            color: #3e2723;
            font-weight: 600;
            border: 2px solid #bcaaa4;
            white-space: nowrap;
        }
        .page-indicator {
            font-size: clamp(0.45rem, 1.5vw, 0.65rem);
            font-weight: 600;
            color: #4e342e;
            background: #efebe9;
            padding: 1px 10px;
            border-radius: 30px;
            border: 2px solid #bcaaa4;
            white-space: nowrap;
        }
        .footer {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-top: 2px;
            flex-wrap: wrap;
            flex-shrink: 0;
            padding: 2px 0;
        }
        .nav-btn, .reset-btn {
            background: #a1887f;
            border: none;
            padding: 5px 12px;
            border-radius: 60px;
            font-size: clamp(0.5rem, 1.8vw, 0.75rem);
            font-weight: bold;
            color: #fff;
            box-shadow: 0 2px 0 #5d4037;
            cursor: pointer;
            border: 2px solid #8d6e63;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            transition: 0.05s linear;
            min-width: 44px;
            justify-content: center;
            flex-shrink: 0;
        }
        .nav-btn:active, .reset-btn:active {
            transform: translateY(2px);
            box-shadow: 0 0 0 #5d4037;
        }
        .nav-btn:disabled {
            opacity: 0.4;
            transform: translateY(1px);
            box-shadow: 0 1px 0 #5d4037;
            pointer-events: none;
        }
        .toast {
            background: #4caf50;
            color: #fff;
            padding: 1px 12px;
            border-radius: 60px;
            font-weight: 600;
            font-size: clamp(0.4rem, 1.5vw, 0.65rem);
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
            display: inline-block;
            margin-top: 0;
            border: 2px solid #388e3c;
        }
        .toast.show {
            visibility: visible;
            opacity: 1;
        }
        .fallback-emoji {
            font-size: 2.5rem;
            line-height: 1;
            pointer-events: none;
        }
        @media (max-width: 450px) {
            .app-container { padding: 6px 6px 8px; max-height: 96vh; border-radius: 24px; }

            .card-image { width: 90% !important; height: 85% !important; }
            .card-list { gap: 4px; }
            .column { flex: 1 1 80px; min-width: 60px; gap: 2px; }
            .drag-clone { width: 75px; height: 75px; }

            .fallback-emoji { font-size: 2rem; }

            .card-image { width: 88% !important; height: 82% !important; }
            .column { flex: 1 1 60px; min-width: 50px; gap: 2px; }
            .nav-btn, .reset-btn { font-size: clamp(0.4rem, 1.5vw, 0.55rem); padding: 3px 6px; min-width: 32px; box-shadow: 0 1.5px 0 #5d4037; border-width: 1.5px; }
            .drag-clone { width: 60px; height: 60px; }
            .drag-clone img { width: 88% !important; height: 82% !important; }
            .fallback-emoji { font-size: 1.6rem; }
        }
        @media (max-height: 560px) {

            .card-item { max-width: 60px; border-radius: 10px 6px 10px 6px; border-width: 2px; box-shadow: 0 2px 0 #b8957a, 0 3px 6px rgba(0,0,0,0.08); padding: 2px; }
            .card-image { width: 88% !important; height: 82% !important; }
            .card-list { gap: 3px; }
            .column { gap: 2px; }

<script>
(function() {
    // === ÂM THANH ===
    let audioCtx = null;
    function ensureAudioContext() {
        if (!audioCtx) {
            try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
        return audioCtx;
    }
    function playSound(type) {
        const ctx = ensureAudioContext();
        if (!ctx) return;
        try {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1047, ctx.currentTime);
                osc.frequency.setValueAtTime(1319, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.25, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.25);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, ctx.currentTime);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.3);
            }
        } catch(e) {}
    }

    // === GIỌNG NÓI ===
    function speakName(name) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(name);
            u.lang = 'vi-VN';
            u.rate = 0.9;
            u.pitch = 1.1;
            const voices = window.speechSynthesis.getVoices();
            const vn = voices.find(v => v.lang.startsWith('vi'));
            if (vn) u.voice = vn;
            window.speechSynthesis.speak(u);
        }
    }

    // === XÁO TRỘN ===
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }
    function generateShuffledIndices(len) {
        return shuffleArray([...Array(len).keys()]);

				{ id: 2, name: 'Con khỉ', imageUrl: ' https://lh3.googleusercontent.com/d/17TfxuDT3SWcKgi0NZ1jlLPUqJn8sWaHu ', shadowUrl: ' https://lh3.googleusercontent.com/d/17TfxuDT3SWcKgi0NZ1jlLPUqJn8sWaHu ' },
				{ id: 3, name: 'Con sâu', imageUrl: ' https://lh3.googleusercontent.com/d/1gHfycpZ9BMiZYm-0FUgBBtdSc7h4lllb ', shadowUrl: ' https://lh3.googleusercontent.com/d/1gHfycpZ9BMiZYm-0FUgBBtdSc7h4lllb ' }
			],
			[
				{ id: 0, name: 'Cá', imageUrl: '...', shadowUrl: '' },
				{ id: 1, name: 'Rùa', imageUrl: '...', shadowUrl: '' },
				{ id: 2, name: 'Ếch', imageUrl: '...', shadowUrl: '' },
				{ id: 3, name: 'Bướm', imageUrl: '...', shadowUrl: '' }
			]
    ];

    // === STATE ===
    let currentPage = 0;
    let totalPages = PAGES.length;
    let currentPairs = PAGES[currentPage];
    let matchedPairs = new Array(currentPairs.length).fill(false);
    let currentShuffledIndices = generateShuffledIndices(currentPairs.length);
    let selectedImageId = null;

    // DOM refs
    const container = document.getElementById('appContainer');
    const imageColumn = document.getElementById('imageColumn');
    const shadowColumn = document.getElementById('shadowColumn');
    const pairsStatus = document.getElementById('pairsStatus');
    const feedbackMsg = document.getElementById('feedbackMessage');
    const winToast = document.getElementById('winToast');
    const pageIndicator = document.getElementById('pageIndicator');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const resetBtn = document.getElementById('resetGameBtn');

    // === HÀM LẤY EMOJI DỰ PHÒNG ===
    function getEmoji(name) {
        const map = {
            'Chó':'🐶','Mèo':'🐱','Voi':'🐘','Gấu':'🐻',
            'Hổ':'🐯','Khỉ':'🐒','Thỏ':'🐰','Cáo':'🦊',
            'Sư tử':'🦁','Nai':'🦌','Sóc':'🐿️','Chim':'🐦',
            'Cá':'🐟','Rùa':'🐢','Ếch':'🐸','Bướm':'🦋'
        };
        return map[name] || '🐾';
    }

    // === RENDER ===
    function render() {
        imageColumn.innerHTML = '';
        shadowColumn.innerHTML = '';

        currentPairs.forEach((pair, index) => {
            const card = document.createElement('div');
            card.className = 'card-item';
            if (matchedPairs[index]) card.classList.add('matched');
            card.dataset.id = index;
            card.dataset.type = 'image';
            const content = document.createElement('div');
            content.className = 'card-content';
            content.innerHTML = `
                <img class="card-image" src="${pair.imageUrl}" alt="${pair.name}" loading="lazy"
                     onerror="this.style.display='none'; this.parentElement.querySelector('.fallback-emoji').style.display='block';">
                <span class="fallback-emoji" style="display:none;">${getEmoji(pair.name)}</span>
                <span class="animal-name">${pair.name}</span>
            `;
            card.appendChild(content);
            card.addEventListener('click', onImageClick);
            card.addEventListener('touchstart', onImageTouchStart, { passive: false });
            imageColumn.appendChild(card);
        });

        currentShuffledIndices.forEach((origIdx) => {
            const pair = currentPairs[origIdx];
            const card = document.createElement('div');
            card.className = 'card-item shadow-card';
            if (matchedPairs[origIdx]) card.classList.add('matched');
            card.dataset.id = origIdx;
            card.dataset.type = 'shadow';
            const content = document.createElement('div');
            content.className = 'card-content';
            const shadowSrc = (pair.shadowUrl && pair.shadowUrl !== pair.imageUrl) ? pair.shadowUrl : pair.imageUrl;
            content.innerHTML = `
                <img class="card-image" src="${shadowSrc}" alt="${pair.name} bóng" loading="lazy"
                     onerror="this.style.display='none'; this.parentElement.querySelector('.fallback-emoji').style.display='block';">
                <span class="fallback-emoji" style="display:none;">${getEmoji(pair.name)}</span>
            `;
            card.appendChild(content);
            card.addEventListener('click', onShadowClick);
            shadowColumn.appendChild(card);
        });

        if (selectedImageId !== null && !matchedPairs[selectedImageId]) {
            const imageCards = imageColumn.querySelectorAll('.card-item');
            imageCards.forEach(card => {
                if (parseInt(card.dataset.id) === selectedImageId) {
                    card.classList.add('selected');
                }
            });
        }

        const matchedCount = matchedPairs.filter(v => v).length;
        pairsStatus.textContent = `${matchedCount} / ${currentPairs.length} cặp`;

        const isComplete = matchedCount === currentPairs.length;
        if (isComplete) {
            feedbackMsg.textContent = '🎉 Hoàn thành trang!';
            winToast.classList.add('show');
            // Không disable nút next vì đã cho chuyển tự do
        } else {
            winToast.classList.remove('show');
            if (selectedImageId !== null && !matchedPairs[selectedImageId]) {
                feedbackMsg.textContent = `🔍 Đang chọn: ${currentPairs[selectedImageId].name}`;
            } else {
                feedbackMsg.textContent = '💡 Kéo ảnh qua bóng';
            }
        }
        // Nút trước/sau không bị disable do không cần hoàn thành
        prevBtn.disabled = (currentPage === 0);
        nextBtn.disabled = (currentPage === totalPages - 1);

        pageIndicator.textContent = `Trang ${currentPage+1} / ${totalPages}`;
    }

    // === CHẾ ĐỘ CLICK ===
    function onImageClick(e) {
        const card = e.currentTarget;
        const id = parseInt(card.dataset.id);
        if (matchedPairs[id]) {
            feedbackMsg.textContent = `⛔ ${currentPairs[id].name} đã nối`;
            return;
        }
        if (selectedImageId === id) {
            selectedImageId = null;
            feedbackMsg.textContent = '💡 Đã bỏ chọn';
            render();
            return;
        }
        selectedImageId = id;
        feedbackMsg.textContent = `🔍 Đang chọn: ${currentPairs[id].name}`;
        speakName(currentPairs[id].name);
        render();
    }

    function onImageTouchStart(e) {
        const card = e.currentTarget;
        const id = parseInt(card.dataset.id);
        if (matchedPairs[id]) return;
        card._touchStartTime = Date.now();
        card._touchStartPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }

    function onShadowClick(e) {
        const card = e.currentTarget;
        const shadowId = parseInt(card.dataset.id);
        if (matchedPairs[shadowId]) {
            feedbackMsg.textContent = `⛔ Bóng đã nối`;
            return;
        }
        if (selectedImageId === null) {
            feedbackMsg.textContent = '👆 Chọn ảnh trước (bấm vào ảnh)';
            return;
        }
        if (matchedPairs[selectedImageId]) {
            selectedImageId = null;
            feedbackMsg.textContent = '⚠️ Ảnh đã nối, chọn ảnh khác';
            render();
            return;
        }
        if (selectedImageId === shadowId) {
            matchedPairs[selectedImageId] = true;
            selectedImageId = null;
            feedbackMsg.textContent = '✅ Nối đúng!';
            playSound('correct');
            render();
        } else {
            feedbackMsg.textContent = `❌ Sai! ${currentPairs[selectedImageId].name} không khớp`;
            playSound('wrong');
            render();
            card.classList.add('shake');
            setTimeout(() => card.classList.remove('shake'), 300);
        }
    }

    // === KÉO THẢ ===
    let dragData = null;
    let dragTarget = null;

    function initDragDrop() {
        document.addEventListener('touchstart', onDragStartTouch, { passive: false });
        document.addEventListener('touchmove', onDragMoveTouch, { passive: false });
        document.addEventListener('touchend', onDragEndTouch);
        document.addEventListener('touchcancel', onDragEndTouch);
        document.addEventListener('mousedown', onDragStartMouse);
        document.addEventListener('mousemove', onDragMoveMouse);
        document.addEventListener('mouseup', onDragEndMouse);
    }

    function onDragStartTouch(e) {
        const touch = e.touches[0];
        const el = document.elementFromPoint(touch.clientX, touch.clientY);
        const card = el ? el.closest('.card-item[data-type="image"]') : null;
        if (!card) return;
        const id = parseInt(card.dataset.id);
        if (matchedPairs[id]) return;
        e.preventDefault();
        startDrag(card, touch.clientX, touch.clientY);
    }

    function onDragMoveTouch(e) {
        if (!dragData) return;
        e.preventDefault();
        const touch = e.touches[0];
        moveDrag(touch.clientX, touch.clientY);
    }

    function onDragEndTouch(e) {
        if (!dragData) return;
        const pos = e.changedTouches ? e.changedTouches[0] : null;
        if (pos) endDrag(pos.clientX, pos.clientY);
        else endDrag(null, null);
    }

    function onDragStartMouse(e) {
        const el = document.elementFromPoint(e.clientX, e.clientY);
        const card = el ? el.closest('.card-item[data-type="image"]') : null;
        if (!card) return;
        const id = parseInt(card.dataset.id);
        if (matchedPairs[id]) return;
        startDrag(card, e.clientX, e.clientY);
    }

    function onDragMoveMouse(e) {
        if (!dragData) return;
        moveDrag(e.clientX, e.clientY);
    }

    function onDragEndMouse(e) {
        if (!dragData) return;
        endDrag(e.clientX, e.clientY);
    }

    function startDrag(card, cx, cy) {
        const rect = card.getBoundingClientRect();
        const clone = document.createElement('div');
        clone.className = 'drag-clone';
        const content = card.querySelector('.card-content');
        if (content) {
            const img = content.querySelector('img');
            const emoji = content.querySelector('.fallback-emoji');
            if (img && img.style.display !== 'none') {
                const newImg = document.createElement('img');
                newImg.src = img.src;
                newImg.alt = img.alt;
                clone.appendChild(newImg);
            } else if (emoji) {
                const newEmoji = document.createElement('span');
                newEmoji.textContent = emoji.textContent;
                newEmoji.style.fontSize = '2.5rem';
                clone.appendChild(newEmoji);
            }
        }
        document.body.appendChild(clone);

        dragData = {
            element: card,
            clone: clone,
            offsetX: cx - rect.left,
            offsetY: cy - rect.top,
            id: parseInt(card.dataset.id),
        };
        card.classList.add('dragging');
        const pair = currentPairs[parseInt(card.dataset.id)];
        speakName(pair.name);
        updateClonePosition(cx, cy);
    }

    function moveDrag(cx, cy) {
        if (!dragData) return;
        updateClonePosition(cx, cy);

        document.querySelectorAll('.shadow-card.drag-over').forEach(c => c.classList.remove('drag-over'));
        const el = document.elementFromPoint(cx, cy);
        if (el) {
            const shadowCard = el.closest('.shadow-card');
            if (shadowCard && !matchedPairs[parseInt(shadowCard.dataset.id)]) {
                shadowCard.classList.add('drag-over');
                dragTarget = shadowCard;
            } else {
                dragTarget = null;
            }
        } else {
            dragTarget = null;
        }
    }

    function endDrag(cx, cy) {
        document.querySelectorAll('.shadow-card.drag-over').forEach(c => c.classList.remove('drag-over'));

        if (dragTarget && cx !== null && cy !== null) {
            const shadowId = parseInt(dragTarget.dataset.id);
            const imageId = dragData.id;
            if (imageId === shadowId) {
                matchedPairs[imageId] = true;
                playSound('correct');
                feedbackMsg.textContent = '✅ Nối đúng!';
                selectedImageId = null;
                render();
            } else {
                playSound('wrong');
                feedbackMsg.textContent = `❌ Sai! ${currentPairs[imageId].name} không khớp`;
                dragTarget.classList.add('shake');
                setTimeout(() => dragTarget.classList.remove('shake'), 300);
                dragData.element.classList.add('shake');
                setTimeout(() => dragData.element.classList.remove('shake'), 300);
                render();
            }
        } else {
            render();
        }

        if (dragData.clone && dragData.clone.parentNode) {
            dragData.clone.parentNode.removeChild(dragData.clone);
        }
        if (dragData.element) {
            dragData.element.classList.remove('dragging');
        }
        dragData = null;
        dragTarget = null;
    }

    function updateClonePosition(cx, cy) {
        if (!dragData || !dragData.clone) return;
        dragData.clone.style.left = cx + 'px';
        dragData.clone.style.top = cy + 'px';
    }

    // === CHUYỂN TRANG TỰ DO (không cần hoàn thành) ===
    function goToPage(page) {
        if (page < 0 || page >= totalPages) return;
        currentPage = page;
        currentPairs = PAGES[currentPage];
        matchedPairs = new Array(currentPairs.length).fill(false);
        currentShuffledIndices = generateShuffledIndices(currentPairs.length);
        selectedImageId = null;
        winToast.classList.remove('show');
        feedbackMsg.textContent = `📖 Trang ${currentPage+1}`;
        render();
    }

    function resetGame() {
        matchedPairs = new Array(currentPairs.length).fill(false);
        currentShuffledIndices = generateShuffledIndices(currentPairs.length);
        selectedImageId = null;
        winToast.classList.remove('show');
        feedbackMsg.textContent = '🔄 Đã làm mới trang';
        render();
    }

    // === GÁN SỰ KIỆN ===
    prevBtn.addEventListener('click', () => goToPage(currentPage-1));
    nextBtn.addEventListener('click', () => {
        if (currentPage < totalPages - 1) goToPage(currentPage+1);
    });
    resetBtn.addEventListener('click', resetGame);

    // === VUỐT ===
    let swipeStartX = null;
    let swipeStartY = null;
    let swipeStartTime = null;
    let isSwiping = false;

    function handleTouchStart(e) {
        if (dragData) return;
        const touch = e.touches[0];
        swipeStartX = touch.clientX;
        swipeStartY = touch.clientY;
        swipeStartTime = Date.now();
        isSwiping = false;
    }

    function handleTouchMove(e) {
        if (dragData) return;
        if (swipeStartX === null) return;
        const touch = e.touches[0];
        const deltaX = touch.clientX - swipeStartX;
        const deltaY = touch.clientY - swipeStartY;
        if (Math.abs(deltaX) > 30 && Math.abs(deltaY) < 50) {
            isSwiping = true;
            e.preventDefault();
        }
    }

    function handleTouchEnd(e) {
        if (dragData) return;
        if (swipeStartX === null) return;
        if (!isSwiping) {
            swipeStartX = null;
            return;
        }
        const touch = e.changedTouches[0];
        const deltaX = touch.clientX - swipeStartX;
        const deltaY = touch.clientY - swipeStartY;
        const elapsed = Date.now() - swipeStartTime;

        if (elapsed < 400 && Math.abs(deltaX) > 50 && Math.abs(deltaY) < 60) {
            if (deltaX < 0) {
                if (currentPage < totalPages - 1) {
                    goToPage(currentPage + 1);
                } else {
                    feedbackMsg.textContent = '🏁 Đã ở trang cuối cùng';
                    setTimeout(() => feedbackMsg.textContent = '💡 Kéo ảnh qua bóng', 1000);
                }
            } else {
                if (currentPage > 0) {
                    goToPage(currentPage - 1);
                } else {
                    feedbackMsg.textContent = '🏁 Đã ở trang đầu tiên';
                    setTimeout(() => feedbackMsg.textContent = '💡 Kéo ảnh qua bóng', 1000);
                }
            }
        }
        swipeStartX = null;
        swipeStartY = null;
        isSwiping = false;
    }

    container.addEventListener('touchstart', handleTouchStart, { passive: false });
    container.addEventListener('touchmove', handleTouchMove, { passive: false });
    container.addEventListener('touchend', handleTouchEnd, { passive: false });

    // === KHỞI TẠO ===
    if ('speechSynthesis' in window) {
        window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = () => {
            window.speechSynthesis.getVoices();
        };
    }

    initDragDrop();
    render();
    feedbackMsg.textContent = '💡 Kéo ảnh thả vào bóng';

    document.addEventListener('touchstart', () => ensureAudioContext(), { once: true });
    document.addEventListener('click', () => ensureAudioContext(), { once: true });
})();
</script>
</body>
</html>
